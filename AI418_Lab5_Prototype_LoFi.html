<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI418 Lab 5 — Lo-fi Clickable Prototype</title>
<style>
body{font-family:Arial,sans-serif;background:#eee;margin:0;padding:24px;color:#222}
.screen{display:none;max-width:520px;margin:auto;background:#fff;border:2px solid #555;padding:24px;min-height:520px;box-sizing:border-box}
.screen.active{display:block}
.placeholder{border:2px solid #888;background:#ddd;padding:55px 15px;text-align:center;margin:22px 0}
.line{height:12px;background:#ddd;margin:10px 0;width:90%}
.line.short{width:60%}
button{padding:14px 18px;border:2px solid #444;background:#ddd;color:#111;font-size:16px;cursor:pointer}
button:hover{background:#ccc}
textarea{width:100%;min-height:150px;box-sizing:border-box;border:2px solid #666;padding:12px;font-size:16px;background:#fff}
label{display:block;font-weight:bold;margin-bottom:8px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
</style>
</head>
<body>
<section id="s1" class="screen active">
<h1>Lecture</h1>
<div class="placeholder">Lecture content</div>
<div class="line"></div><div class="line"></div><div class="line short"></div>
<div class="actions">
<button onclick="show('s2')">Ask privately</button>
</div>
</section>

<section id="s2" class="screen">
<h1>Ask the instructor privately</h1>
<label for="q">Write your question</label>
<textarea id="q" placeholder="Type your question here"></textarea>
<div class="actions">
<button onclick="show('s3')">Send question</button>
<button onclick="show('s1')">Back to lecture</button>
</div>
</section>

<section id="s3" class="screen">
<h1>Question sent</h1>
<div class="placeholder">Your question was sent privately to the instructor.</div>
<div class="actions">
<button onclick="show('s1')">Back to lecture</button>
</div>
</section>

<script>
function show(id){
  document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
</script>
</body>
</html>
